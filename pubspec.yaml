name: thielal
description: "Frontend Flutter de l'application Thielal / LifeLink."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.2

  # Navigation
  go_router: ^16.2.1

  # Networking
  dio: ^5.9.0

  # Secure storage
  flutter_secure_storage: ^10.0.0-beta.4

  # Assets / UI
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/symbol.png"
  background_color: "#ffffff"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
