name: thielal
description: "Frontend Flutter de l'application Thielal / LifeLink."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  shared_preferences: ^2.5.3

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobile_scanner: 6.0.0
  qr_flutter: ^4.1.0

  intl: ^0.20.2
  url_launcher: ^6.3.0

  # State management
  flutter_riverpod: ^3.0.2

  # Navigation
  go_router: ^16.2.1

  # Networking
  dio: ^5.9.0

  sms_autofill: ^2.3.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  geolocator: ^12.0.0
  http: ^1.2.1
  share_plus: ^10.0.2
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.4
  font_awesome_flutter: ^10.7.0
  device_info_plus: ^11.1.0
  # flutter_map_polyline_point: ^1.0.0

  # Secure storage
  flutter_secure_storage: ^10.0.0-beta.4

  # Assets / UI
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  socket_io_client: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  background_color: "#ffffff"
  min_sdk_android: 21


flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo.png"
  # android_12:
  #   image: "assets/images/logo.png"

# flutter_native_splash:
 # color: "#ffffff"
 # image: "assets/images/logo.png"
 # android_12:
  #  image: "assets/images/logo.png" 


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/onboarding/
